<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{SiteName}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f5f7;">

<!-- Preview text shown next to the subject in the inbox -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f2f5f7;font-size:1px;line-height:1px;">
  {{Preheader}}
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f5f7;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:12px;">

        <!-- Header -->
        <tr>
          <td style="background-color:#0b2a33;padding:24px 32px;border-bottom:4px solid #009696;border-radius:12px 12px 0 0;">
            {{LogoHtml}}
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#1f2d33;">

            <h1 style="margin:0 0 8px 0;font-size:24px;line-height:1.3;color:#0b2a33;">New contact enquiry</h1>
            <p style="margin:0 0 24px 0;font-size:14px;color:#7a8a91;">Received {{ReceivedAt}}</p>

            <!-- Details -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:15px;">
              <tr>
                <td width="110" valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;color:#7a8a91;">Name</td>
                <td valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;color:#1f2d33;"><strong>{{FullName}}</strong></td>
              </tr>
              <tr>
                <td width="110" valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;color:#7a8a91;">Email</td>
                <td valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;">
                  <a href="mailto:{{Email}}" style="color:#007a7a;text-decoration:none;">{{Email}}</a>
                </td>
              </tr>
              <tr>
                <td width="110" valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;color:#7a8a91;">Phone</td>
                <td valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;color:#1f2d33;">{{Phone}}</td>
              </tr>
              <tr>
                <td width="110" valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;color:#7a8a91;">IP address</td>
                <td valign="top" style="padding:8px 0;border-bottom:1px solid #e6ecee;color:#1f2d33;">{{IpAddress}}</td>
              </tr>
            </table>

            <p style="margin:24px 0 8px 0;font-weight:bold;color:#0b2a33;">Message</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background-color:#f2f8f8;border-left:4px solid #009696;padding:16px;font-size:15px;line-height:1.6;color:#33454d;">
                  {{Message}}
                </td>
              </tr>
            </table>

            <!-- Reply button -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;">
              <tr>
                <td style="background-color:#009696;border-radius:6px;">
                  <a href="mailto:{{Email}}" style="display:inline-block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;">Reply to {{FullName}}</a>
                </td>
              </tr>
            </table>

          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color:#f7fafa;padding:20px 32px;border-radius:0 0 12px 12px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#7a8a91;">
            This enquiry was also saved in the ContactUs table.<br>
            &copy; {{Year}} {{SiteName}}
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
